name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge Functions with the frozen lockfile
        run: deno test --node-modules-dir=auto --frozen --allow-env --allow-net supabase/functions

  database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local Supabase services
        run: supabase start

      - name: Run database regression tests
        run: supabase test db --local supabase/tests

      - name: Seed the disposable local database for browser tests
        run: supabase db reset --local --yes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies for the browser tests
        run: npm ci

      - name: Expose the local Supabase URL and key to Playwright
        run: |
          supabase status --output env > supabase.env
          url=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')
          key=$(grep '^PUBLISHABLE_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          [ -n "$key" ] || key=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          rm supabase.env
          echo "HRIS_E2E_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "HRIS_E2E_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run role-based browser journeys
        env:
          HRIS_E2E_PASSWORD: DemoPass!2026
        run: npm run test:e2e
