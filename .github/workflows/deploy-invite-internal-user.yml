name: Deploy invitation Edge Function

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-invite-internal-user.yml
      - supabase/functions/invite-internal-user/**
      - supabase/functions/delete-managed-user/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Keep CI compatible with the checked-in Supabase configuration.
          # The action's former implicit version (2.20.3) cannot parse it.
          version: 2.114.0
      - name: Verify deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Deploy invitation function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy invite-internal-user --project-ref wcjpyzulbiexvwtmyudq --use-api
      - name: Deploy managed-account deletion function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy delete-managed-user --project-ref wcjpyzulbiexvwtmyudq --use-api
